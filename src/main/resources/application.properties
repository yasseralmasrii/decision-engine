spring.application.name=decision-engine

# Render (and most hosts) assign the port through $PORT. Locally it falls back to 8081.
server.port=${PORT:8081}

# Reads LLM_API_KEY etc. from a local .env file if one exists (never commit it).
spring.config.import=optional:file:.env[.properties]

# AI agent (optional). Any OpenAI-compatible API works: Groq, Gemini, OpenAI...
llm.api-key=${LLM_API_KEY:}
llm.base-url=${LLM_BASE_URL:https://api.groq.com/openai/v1}
llm.model=${LLM_MODEL:llama-3.3-70b-versatile}

# Fill the audit log with sample decisions at startup.
demo.seed=${DEMO_SEED:true}